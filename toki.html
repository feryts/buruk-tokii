<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BURUK TOKİ MASTER v74</title>
    <style>
        :root { --ana: #0f172a; --arka: #f1f5f9; --yazi: #1e293b; --mavi: #2563eb; --kirmizi: #ef4444; --yesil: #22c55e; --beyaz: #ffffff; --gri: rgba(71, 85, 105, 0.7); --turuncu: #f59e0b; --zoom: 0.5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--arka); color: var(--yazi); overflow: hidden; position: fixed; width: 100%; height: 100%; }

        /* Menü Yapısı */
        .tabs { display: flex; background: var(--ana); height: 60px; z-index: 2000; position: relative; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .tab.active { color: #fff; border-bottom: 3px solid var(--mavi); background: rgba(255,255,255,0.05); }

        .page { padding: 15px; height: calc(100vh - 60px); overflow-y: auto; display: none; }
        .page.active { display: block; }

        /* Formlar */
        .card { background: var(--beyaz); padding: 15px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        textarea, input { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 16px; font-weight: 600; background: #f8fafc; color: var(--ana); }
        .btn-main { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: 800; background: var(--mavi); color: white; font-size: 15px; cursor: pointer; }

        /* Harita Barı */
        .h-bar { position: fixed; top: 60px; left: 0; right: 0; z-index: 1500; background: white; padding: 8px; border-bottom: 1px solid #ddd; display: flex; gap: 5px; align-items: center; }
        .mode-btn { padding: 10px 4px; border-radius: 10px; border: 1px solid #ddd; background: #f8fafc; font-size: 9px; font-weight: 900; flex: 1; text-align: center; color: #64748b; }
        .mode-btn.active { background: var(--ana); color: white; border-color: var(--ana); }
        .zoom-btn { width: 35px; height: 35px; border-radius: 8px; border: 1px solid #ddd; background: white; font-weight: bold; font-size: 18px; }

        /* YENİ GİRİŞ PANELİ (ÜSTTE - KLAVYE DOSTU) */
        #inputPanel { 
            position: fixed; top: 115px; left: 10px; right: 10px; 
            background: white; padding: 15px; border-radius: 20px; 
            z-index: 3000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid var(--mavi);
        }

        /* MİKRO ETİKETLER */
        .pin { 
            position: absolute; transform: translate(-50%, -50%) scale(calc(1 / var(--zoom, 0.5))); 
            z-index: 500; display: flex; align-items: center; justify-content: center;
        }
        .block-label { 
            background: var(--gri); color: white; padding: 1px 3px; border-radius: 3px; 
            font-size: 7.5px; font-weight: 900; white-space: nowrap; pointer-events: auto;
            border: 0.5px solid rgba(255,255,255,0.3); transition: all 0.15s;
        }
        .pin.has-wait .block-label { background: var(--turuncu); border-color: #fff; font-size: 8.5px; z-index: 600; }
        .pin.is-done .block-label { background: var(--yesil); opacity: 0.8; }

        /* Harita Alanı */
        .viewport { position: relative; width: 100%; height: 100%; overflow: auto; background: #cbd5e1; margin-top: 50px; }
        .canvas { position: relative; display: inline-block; transform-origin: 0 0; }
        #mapImg { display: block; width: 2200px; height: auto; pointer-events: none; }

        /* Modal */
        #customerModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: white; border-radius: 24px; z-index: 4000; display: none; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3500; display: none; }

        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 400; }
        .zone-poly { fill: rgba(37, 99, 235, 0.1); stroke: var(--mavi); stroke-width: calc(2px / var(--zoom, 0.5)); }

        .etap-baslik { background: var(--ana); color: white; padding: 10px 15px; border-radius: 10px; margin: 15px 0 8px 0; font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; }
        .liste-oge { background: #fff; padding: 12px; border-radius: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    </style>
</head>
<body>

<div id="overlay" onclick="closeModal()"></div>

<div id="inputPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <span style="font-weight:900; font-size:12px; color:var(--mavi);">BLOK KAYIT</span>
        <button onclick="deleteCurrentBlok()" id="delBtn" style="background:none; border:none; color:var(--kirmizi); font-size:20px; display:none;">🗑️</button>
    </div>
    <input type="text" id="blokInput" placeholder="Blok No Yazın..." onkeydown="checkEnter(event)" oninput="UB(this)">
    <div style="display:flex; gap:8px; margin-top:8px;">
        <button onclick="saveBlok()" style="background:var(--yesil); flex:2; color:white; border:none; padding:12px; border-radius:12px; font-weight:bold;">KAYDET</button>
        <button onclick="closeInput()" style="background:var(--gri); flex:1; color:white; border:none; padding:12px; border-radius:12px; font-weight:bold;">İPTAL</button>
    </div>
</div>

<div id="customerModal">
    <div style="font-weight:900; font-size:18px; margin-bottom:15px;" id="modalTitle">MÜŞTERİLER</div>
    <div id="modalList"></div>
    <button class="btn-main" onclick="closeModal()" style="background:var(--gri); margin-top:10px;">KAPAT</button>
</div>

<div class="tabs">
    <div class="tab active" onclick="go('list')">LİSTE</div>
    <div class="tab" onclick="go('setup')">AYAR</div>
    <div class="tab" onclick="go('map')">HARİTA</div>
</div>

<div id="page-list" class="page active">
    <div class="card">
        <h3>🚀 YENİ LİSTE</h3>
        <textarea id="seriIn" placeholder="Ahmet a1&#10;Mehmet b72..." oninput="UB(this)"></textarea>
        <button class="btn-main" onclick="autoProcess()">AYRIŞTIR</button>
    </div>
    <div id="renderArea"></div>
    <button id="clearBtn" class="btn-main" style="background:var(--kirmizi); margin-top:20px; display:none;" onclick="resetList()">TEMİZLE</button>
</div>

<div id="page-setup" class="page">
    <div class="card">
        <h3>🗺️ MASTER HARİTA</h3>
        <input type="file" accept="image/*" onchange="uploadMap(this)">
    </div>
    <div class="card">
        <h3>💾 YEDEKLEME</h3>
        <button onclick="exportDB()" class="btn-main">YEDEK AL</button>
        <label class="btn-main" style="display:block; text-align:center; margin-top:10px;">YÜKLE<input type="file" onchange="importDB(this)" style="display:none;"></label>
    </div>
    <button class="btn-main" onclick="resetZones()" style="background:var(--kirmizi); margin-top:10px;">SİSTEMİ SIFIRLA</button>
</div>

<div id="page-map" class="page" style="padding:0;">
    <div class="h-bar">
        <div class="mode-btn active" id="m-view" onclick="setMod('view')">🖐️ KAYDIR</div>
        <div class="mode-btn" id="m-draw" onclick="setMod('draw')">✏️ ÇİZ</div>
        <div class="mode-btn" id="m-blok" onclick="setMod('blok')">📍 BLOK KOY</div>
        <button class="zoom-btn" onclick="zoom(0.12)">+</button>
        <button class="zoom-btn" onclick="zoom(-0.12)">-</button>
    </div>
    <div class="viewport" id="vPort">
        <div class="canvas" id="zemin" onmousedown="hStart(event)" ontouchstart="hStart(event)" onmousemove="hMove(event)" ontouchmove="hMove(event)" onmouseup="hEnd()" ontouchend="hEnd()">
            <img src="" id="mapImg">
            <svg id="svgLayer"></svg>
        </div>
    </div>
</div>

<script>
    let idb;
    const req = indexedDB.open("BurukTurboV74", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("assets", {keyPath: "id"});
    req.onsuccess = e => { idb = e.target.result; startup(); };

    let db = JSON.parse(localStorage.getItem('buruk_v74_data')) || { zones: [], blocks: {}, items: [] };
    let mod = "view", sc = 0.5, currentPath = [], isAction = false, curX = 0, curY = 0, editingKey = null;

    function UB(el) { el.value = el.value.toLocaleUpperCase('tr-TR'); }
    function save() { localStorage.setItem('buruk_v74_data', JSON.stringify(db)); }
    function startup() { loadMapUI(); renderList(); updateZoomCSS(); }
    function updateZoomCSS() { document.getElementById('zemin').style.transform = `scale(${sc})`; document.documentElement.style.setProperty('--zoom', sc); }
    function zoom(v) { sc = Math.min(Math.max(sc + v, 0.1), 3); updateZoomCSS(); drawZones(); }

    function setMod(m) {
        mod = m;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-' + m).classList.add('active');
        document.getElementById('vPort').className = "viewport" + (m !== 'view' ? ' no-scroll' : '');
        closeInput(); drawZones();
    }

    // --- KLAVYE "GİT" KONTROLÜ ---
    function checkEnter(e) {
        if(e.key === 'Enter') {
            e.preventDefault();
            saveBlok();
        }
    }

    // --- KOORDİNAT HESABI (2200px TABANLI) ---
    function getPreciseCoords(e) {
        const img = document.getElementById('mapImg');
        const rect = img.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        const ratio = 2200 / rect.width;
        return { x: (t.clientX - rect.left) * ratio, y: (t.clientY - rect.top) * ratio };
    }

    function hStart(e) {
        if(mod === 'view') return;
        isAction = true;
        const coords = getPreciseCoords(e);
        curX = coords.x; curY = coords.y;

        if(mod === 'blok') {
            editingKey = null;
            document.getElementById('blokInput').value = "";
            document.getElementById('delBtn').style.display = 'none';
            document.getElementById('inputPanel').style.display = 'block';
            setTimeout(() => document.getElementById('blokInput').focus(), 150);
        } else if (mod === 'draw') currentPath = [{x: curX, y: curY}];
    }

    function hMove(e) {
        if(!isAction || mod !== 'draw') return;
        e.preventDefault();
        const coords = getPreciseCoords(e);
        currentPath.push({ x: coords.x, y: coords.y });
        const svg = document.getElementById('svgLayer');
        let temp = document.getElementById('temp');
        if(!temp) { temp = document.createElementNS("http://www.w3.org/2000/svg", "polyline"); temp.id = "temp"; temp.setAttribute("style", `fill:none; stroke:red; stroke-width:${3/sc}px;`); svg.appendChild(temp); }
        temp.setAttribute("points", currentPath.map(p => p.x+','+p.y).join(' '));
    }

    function hEnd() {
        if(!isAction || mod !== 'draw') { isAction = false; return; }
        isAction = false;
        if(currentPath.length < 3) return;
        const gNo = prompt("Güzergah Adı:");
        if(gNo) { let p = [...currentPath]; p.push(p[0]); db.zones.push({ name: gNo.toUpperCase(), points: p }); save(); }
        document.getElementById('temp')?.remove(); drawZones(); currentPath = [];
    }

    function saveBlok() {
        const b = document.getElementById('blokInput').value.trim().toUpperCase();
        if(b) {
            if(editingKey) delete db.blocks[editingKey];
            db.blocks[b] = {x: curX, y: curY};
            save(); drawZones();
        }
        closeInput();
    }

    function deleteCurrentBlok() {
        if(editingKey && confirm(editingKey + " SİLİNSİN Mİ?")) {
            delete db.blocks[editingKey];
            save(); drawZones(); closeInput();
        }
    }

    function closeInput() { document.getElementById('inputPanel').style.display = 'none'; editingKey = null; }

    function drawZones() {
        const svg = document.getElementById('svgLayer');
        svg.innerHTML = db.zones.map((z, i) => `<polygon points="${z.points.map(p => p.x+','+p.y).join(' ')}" class="zone-poly" style="fill:hsla(${i*75}, 70%, 55%, 0.12); stroke:hsl(${i*75}, 70%, 55%);"></polygon>`).join("");
        
        const z = document.getElementById('zemin');
        z.querySelectorAll('.pin').forEach(e=>e.remove());
        
        const statusMap = {};
        db.items.forEach(i => {
            if(!statusMap[i.bl]) statusMap[i.bl] = { wait: 0, done: 0 };
            statusMap[i.bl][i.st]++;
        });

        const target = (mod === 'blok') ? db.blocks : statusMap;

        Object.keys(target).forEach(bl => {
            const b = db.blocks[bl]; if(!b) return;
            const stats = statusMap[bl] || { wait: 0, done: 0 };
            const p = document.createElement('div');
            const hasWait = stats.wait > 0;
            const fullyDone = stats.wait === 0 && stats.done > 0;
            
            p.className = 'pin' + (hasWait ? ' has-wait' : '') + (fullyDone ? ' is-done' : '');
            p.style.left = b.x + "px"; p.style.top = b.y + "px";
            p.innerHTML = `<div class="block-label">${bl}${fullyDone ? ' ✓' : ''}</div>`;
            
            p.onclick = e => { 
                e.stopPropagation(); 
                if(mod==='blok'){
                    editingKey = bl; curX = b.x; curY = b.y;
                    document.getElementById('blokInput').value = bl;
                    document.getElementById('delBtn').style.display = 'block';
                    document.getElementById('inputPanel').style.display = 'block';
                    setTimeout(() => document.getElementById('blokInput').select(), 150);
                } 
                else { openModal(bl); }
            };
            z.appendChild(p);
        });
    }

    function openModal(bl) {
        const list = db.items.filter(i => i.bl === bl && i.st === 'wait');
        if(list.length === 0) return;
        document.getElementById('modalTitle').innerText = bl + " MÜŞTERİLERİ";
        const c = document.getElementById('modalList'); c.innerHTML = "";
        list.forEach(i => {
            c.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:12px; margin-bottom:8px; border-radius:12px;">
                <b>${i.is}</b>
                <button class="btn-sm" style="background:var(--yesil); color:white; border:none; padding:8px 12px; border-radius:8px;" onclick="deliverOne('${i.is}','${bl}')">TESLİM ET</button>
            </div>`;
        });
        document.getElementById('customerModal').style.display='block'; document.getElementById('overlay').style.display='block';
    }

    function deliverOne(is, bl) {
        db.items.forEach(i => { if(i.is === is && i.bl === bl) i.st = 'done'; });
        save(); renderList(); drawZones();
        const rem = db.items.filter(i => i.bl === bl && i.st === 'wait');
        if(rem.length > 0) openModal(bl); else closeModal();
    }

    function closeModal() { document.getElementById('customerModal').style.display='none'; document.getElementById('overlay').style.display='none'; }

    function autoProcess() {
        const txt = document.getElementById('seriIn').value.trim().toLocaleUpperCase('tr-TR');
        if(!txt) return;
        txt.split('\n').forEach(line => {
            const parts = line.trim().split(/\s+/); if(parts.length < 2) return;
            const rawBl = parts.pop(); const is = parts.join(" ");
            let bl = rawBl;
            if(!db.blocks[bl]) { let tire = rawBl[0] + '-' + rawBl.slice(1); if(db.blocks[tire]) bl = tire; }
            if(db.blocks[bl]) {
                let r = "BİLİNMEYEN";
                db.zones.forEach(z => { if(isInside(db.blocks[bl], z.points)) r = z.name; });
                db.items.push({ is, bl, route: r, st: 'wait' });
            }
        });
        save(); renderList(); drawZones(); document.getElementById('seriIn').value = "";
    }

    function renderList() {
        const m = document.getElementById('renderArea'); m.innerHTML = "";
        if(db.items.length === 0) { document.getElementById('clearBtn').style.display='none'; return; }
        document.getElementById('clearBtn').style.display='block';
        const gr = {};
        db.items.forEach(t => { if(!gr[t.route]) gr[t.route] = []; gr[t.route].push(t); });
        Object.keys(gr).sort().forEach(g => {
            let h = `<div class="etap-baslik"><span>${g}</span> <span>${gr[g].length} PKT</span></div>`;
            gr[g].forEach(t => {
                const done = t.st === 'done';
                h += `<div class="liste-oge ${done ? 'is-done' : ''}">
                    <span><b>${t.is}</b> <small>BLOK: ${t.bl}</small></span>
                    <button class="btn-sm" style="background:var(--kirmizi); color:white; border:none; border-radius:8px;" onclick="delItem('${t.is}','${t.bl}')">SİL</button>
                </div>`;
            });
            m.innerHTML += h;
        });
    }

    function delItem(is, bl) { if(confirm("Silinsin mi?")) { db.items = db.items.filter(i => !(i.is === is && i.bl === bl)); save(); renderList(); drawZones(); } }
    function isInside(p, vs) { let x = p.x, y = p.y, ins = false; for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) { let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y; if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins; } return ins; }
    function uploadMap(i) { const r = new FileReader(); r.onload = e => { const tx = idb.transaction("assets", "readwrite"); tx.objectStore("assets").put({id: "master", data: e.target.result}); loadMapUI(); }; r.readAsDataURL(i.files[0]); }
    async function loadMapUI() { const tx = idb.transaction("assets", "readonly"); const r = tx.objectStore("assets").get("master"); r.onsuccess = () => { if(r.result) { document.getElementById('mapImg').src = r.result.data; setTimeout(drawZones, 100); } }; }
    function resetZones() { if(confirm("TÜM SİSTEM SIFIRLANACAK!")) { db.zones=[]; db.blocks={}; db.items=[]; save(); startup(); } }
    function resetList() { if(confirm("LİSTE SİLİNSİN Mİ?")) { db.items=[]; save(); renderList(); drawZones(); } }
    function exportDB() { const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db)); a.download="yedek.json"; a.click(); }
    function importDB(i) { const r = new FileReader(); r.onload = e => { db = JSON.parse(e.target.result); save(); startup(); alert("Yüklendi!"); }; r.readAsText(i.files[0]); }
    function go(s) { document.querySelectorAll('.page, .tab').forEach(e=>e.classList.remove('active')); document.getElementById('page-'+s).classList.add('active'); if(s==='map'){setMod('view');loadMapUI();}else if(s==='list'){renderList();} }
</script>
</body>
</html>
